[Unit]
RequiresMountsFor=/etc/dropbear /etc/shadow
# Either an SSH key or a root password set by wifi-setup is enough to start.
# The leading pipe makes each one a *triggering* condition: systemd ANDs plain
# conditions, even of the same type, and ORs the piped ones. Without the pipes
# dropbear demands a key AND a password, and a fresh key-only install gets no
# SSH at all.
|ConditionFileNotEmpty=/root/.ssh/authorized_keys
|ConditionFileNotEmpty=/root/.ssh/.password-auth
# Systemd stops units in reverse start order, so ordering dropbear before the
# Supervisor and Docker keeps SSH available while their (potentially minutes
# long) teardown runs. Both already require the same mounts dropbear needs, so
# this adds no extra work to boot.
Before=haos-supervisor.service docker.service

[Service]
Type=forking
PIDFile=/run/dropbear.pid
ExecStartPre=
ExecStart=
ExecStart=-/usr/sbin/haos-dropbear
KillMode=mixed
OOMPolicy=continue
