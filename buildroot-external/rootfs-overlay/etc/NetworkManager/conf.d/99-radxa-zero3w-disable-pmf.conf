# Radxa ZERO 3W: disable Protected Management Frames by default.
#
# The AIC8800 is a fullmac part: its firmware builds the (re)association
# request itself.  Against a WPA2/WPA3 mixed-mode AP it associates fine, but
# the AP then deauthenticates during the 4-way handshake with reason 17 -
# "Element in 4-Way Handshake different from (Re)Association Request" - because
# the RSN/RSNXE element wpa_supplicant puts in EAPOL message 2 does not match
# the one the firmware actually sent.  wpa_supplicant reports this as
# "pre-shared key may be incorrect", which is misleading: the PSK is fine.
#
# Defaulting pmf to 1 (disabled) keeps MFP out of the negotiation and lets the
# board associate with WPA3-capable access points without changing the router.
[connection]
wifi.pmf=1
