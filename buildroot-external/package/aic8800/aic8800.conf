# AIC8800 SDIO WiFi: aic8800_bsp powers the chip and loads its firmware,
# aic8800_fdrv registers the wlan interface.
aic8800_bsp
aic8800_fdrv
# The Bluetooth half of the same chip speaks H4 on uart1. aic8800-bt.service
# attaches it with btattach, which needs the HCI UART line discipline; nothing
# autoloads hci_uart once the device tree no longer declares a serdev child.
hci_uart
# Bluetooth HID (keyboards, mice) needs the HIDP protocol module; bluetoothd
# probes for it at startup, so loading it later means no HID until a restart.
hidp
