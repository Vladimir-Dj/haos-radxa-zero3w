# AIC8800 SDIO WiFi: aic8800_bsp powers the chip and loads its firmware,
# aic8800_fdrv registers the wlan interface.
aic8800_bsp
aic8800_fdrv
# The Bluetooth half of the same chip speaks H4 on uart1. hci_uart carries
# the serdev binding the board device tree declares; udev would normally
# autoload it from the OF modalias, but load it explicitly so hci0 appears
# even if the serdev device is probed before udev settles.
hci_uart
